<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação de Economia</title>
</head>
<body>
    <div id="barra-de-navegacao">
        <nav>
            <button id="botao-menu">Menu</button>
            <img src="" alt="Logo da Bulbe Energia">
            <button id="botao-de-notificacao">Sino</button>
            <button id="perfil-do-cliente">Perfil</button>
        </nav>
    </div>

    <div id="texto-principal">
        <h1 id="titulo-principal">Descubra quanto você pode economizar</h1>
    </div>

    <div id="corpo-principal-tela">
        <h2 id="texto-pergunta">Quanto você paga na sua conta mensalmente?</h2>
        <img src="../assets/mulher-imagem-bulbe.png" alt="Imagem de uma mulher da Bulbe">
        
        <div id="simulador-economia">

            <br> <!--Esse br deve ser removido.-->
            <input type="number">
            <br> <!--Esse br deve ser removido.-->
            <input type="range">
            <br> <!--Esse br deve ser removido.-->

            <div id="botoes-valores">
                <button class="botao-valor">R$ 250</button>
                <button class="botao-valor">R$ 500</button>
                <button class="botao-valor">R$ 750</button>
            </div>
        </div>

        <div id="lista-de-beneficios">
            <div class="beneficio">
                <h3>Sem fidelidade</h3>
                <p>Cancele quando quiser</p>
            </div>
            <div class="beneficio">
                <h3>100% digital</h3>
                <p>Processo simples e seguro</p>
            </div>
            <div class="beneficio">
                <h3>Você só paga</h3>
                <p>Se realmente  economizar</p>
            </div>
        </div>
        
    </div>

</body>
</html>

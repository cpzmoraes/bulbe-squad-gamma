<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulbe - Indicações</title>
</head>
<body>

    <div class="app-viewport">

        <div class="top-section">

            <!-- HEADER - BARRA SUPERIOR -->
            <header class="header">
                <button class="icon-btn">
                    <div class="icon-placeholder">Menu</div>
                </button>

                <div class="logo-container">
                    <div class="logo-placeholder">Logo Bulbe</div>
                </div>

                <div class="header-actions">
                    <button class="icon-btn">
                        <div class="icon-placeholder">Sino</div>
                    </button>

                    <button class="profile-circle"></button>
                </div>
            </header>

            <!-- CHAMADA PRINCIPAL-->
            <section class="hero">
                
                <!-- Área textual -->
                <div class="hero-text">
                    <!-- Título principal -->
                    <h1 class="hero-title">
                        Indique amigos e <span class="highlight-yellow">ganhe dinheiro</span>
                    </h1>

                    <!-- Texto explicativo -->
                    <p class="hero-description">
                        Quando seu amigo assina com a Bulbe,
                        você ganha e todo mundo economiza.
                    </p>
                </div>

                <!-- Área da ilustração -->
                <figure class="hero-image">
                    
                    <!-- Placeholder da imagem -->
                    <div class="image-placeholder">
                        Ilustração Indicações
                    </div>
                </figure>
            </section>
        </div>
    </div>
</body>
</html>
